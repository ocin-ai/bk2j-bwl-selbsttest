<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Selbsttest Personal</title>
<style>
:root{
  --navy:#184878; --tint:#eef2f8; --h:#1a1f2b; --t:#2b2f3a; --t2:#454b57; --muted:#6b7280;
  --line:#d7dae0; --input:#f7f8fa; --bg:#ffffff;
  --ok:#2e7d4f; --ok-bg:#e8f4ec; --mid:#9a6b00; --mid-bg:#fbf3df; --bad:#b3261e; --bad-bg:#fbeaea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.5 Calibri,'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif}
header{border-bottom:1px solid var(--navy);padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--t2)}
header b{color:var(--t2)}
header button{font-size:14px}
main{max-width:680px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;color:var(--h);margin:8px 0 4px;line-height:1.2}
h2{font-size:21px;color:var(--h);margin:4px 0 8px;line-height:1.25}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:700}
.meta{font-size:14px;color:var(--muted)}
p{margin:.5em 0}
.box{background:var(--tint);border-left:3px solid var(--navy);padding:10px 12px;margin:12px 0;font-size:15px}
.chap{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px;margin:10px 0;cursor:pointer;font:inherit;color:inherit}
.chap:hover,.chap:focus-visible{border-color:var(--navy)}
.chap .n{color:var(--navy);font-weight:700}
.chap .r{float:right;font-size:14px;font-weight:700;padding:1px 8px;border-radius:10px}
.btn{display:inline-block;font:inherit;font-weight:700;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:10px 18px;cursor:pointer;min-height:44px}
.btn.sec{background:#fff;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.prog{height:4px;background:var(--line);border-radius:2px;margin:6px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy)}
.q{font-size:17px;color:var(--h);margin:6px 0 12px}
.hint{font-size:14px;color:var(--muted);margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;background:#fff}
.opt input{margin-top:4px;width:20px;height:20px;flex:none;accent-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .why{display:block;font-size:14px;color:var(--t2);margin-top:4px}
.zu{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.zu label{display:block;margin-bottom:6px}
select,input[type=text],textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--input);border-radius:6px;padding:9px 10px;color:var(--t)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px}
.zu.right{border-color:var(--ok);background:var(--ok-bg)}
.zu.wrong{border-color:var(--bad);background:var(--bad-bg)}
.zu .sol{font-size:14px;color:var(--t2);margin-top:4px}
.za{display:flex;gap:8px;align-items:center}
.za input{max-width:180px}
.fb{border-left:3px solid var(--navy);background:var(--tint);padding:10px 12px;margin:14px 0;font-size:15px}
.fb .v{font-weight:700;font-size:16px}
.fb .v.ok{color:var(--ok)} .fb .v.mid{color:var(--mid)} .fb .v.bad{color:var(--bad)}
.fb .src{color:var(--t2);font-size:14px;margin-top:6px}
.rel{font-size:13px;color:var(--muted);margin-top:4px}
textarea{min-height:120px;resize:vertical}
.check label{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--navy)}
.badge{display:inline-block;font-weight:700;padding:2px 10px;border-radius:12px;font-size:15px}
.g{color:var(--ok);background:var(--ok-bg)} .y{color:var(--mid);background:var(--mid-bg)} .rd{color:var(--bad);background:var(--bad-bg)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
th{text-align:left;color:var(--navy);border-bottom:2px solid var(--navy);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top}
footer{max-width:680px;margin:0 auto;padding:12px 16px 28px;border-top:1px solid var(--line);font-size:13px;color:var(--t2)}
.sr{position:absolute;left:-9999px}
</style>
</head>

{ id:1, title:"Personalbedarf",
intro:[["Bruttopersonalbedarf","Wie viele Stellen soll die Abteilung im Planungszeitraum insgesamt haben? In Aufgaben heißt das meist „geplanter Stellenbestand“ oder „Planstellen“.<br>Ist nur der aktuelle Stellenbestand angegeben: aktueller Stellenbestand + Mehrbedarf − Minderbedarf"],
 ["Mehrbedarf / Minderbedarf","Mehrbedarf: zusätzliche Stellen, z. B. wegen eines Großauftrags oder einer neuen Abteilung. Minderbedarf: Stellen fallen weg, z. B. durch Automatisierung oder Auftragsrückgang."],
 ["Stellenbestand ≠ Personalbestand","Stellenbestand = Zahl der Stellen (Planstellen). Personalbestand = Zahl der Mitarbeiter, die tatsächlich da sind. Beides kann auseinanderfallen, z. B. bei unbesetzten Stellen."],

  e:"Bruttopersonalbedarf = geplanter Stellenbestand. Die anderen Antworten beschreiben den Personalbestand, den Nettopersonalbedarf und die Abgänge.", s:"Skript Kap. 1, Merke-Box"},
 {t:"za", q:"In der Fertigung der Talwerk GmbH arbeiten 18 Vollzeitkräfte, 6 Teilzeitkräfte mit 50 % und 2 Teilzeitkräfte mit 75 %. Wie hoch ist der Personalbestand in Vollzeitstellen?", unit:"Stellen", a:22.5,

 {t:"za", q:"Fertigung der Talwerk GmbH: Der aktuelle Stellenbestand beträgt 28 Vollzeitstellen. Wegen eines Großauftrags werden 3 zusätzliche Stellen eingeplant; durch eine neue Maschine fällt 1 Stelle weg. Beschäftigt sind zurzeit 24 Vollzeitkräfte und 4 Teilzeitkräfte mit 50 %. Fest steht: Ein Mitarbeiter geht in Ruhestand, eine Mitarbeiterin beginnt ihre Elternzeit, ein Mitarbeiter hat gekündigt, eine Vollzeitkraft wechselt in Altersteilzeit mit 50 %. Zwei Auszubildende werden in Vollzeit übernommen, eine Mitarbeiterin kehrt aus der Elternzeit mit 50 % zurück. Ermitteln Sie den Nettopersonalbedarf in Vollzeitstellen.", unit:"Stellen", a:5,
  e:"Bruttobedarf 30,0 (28 + 3 Mehrbedarf − 1 Minderbedarf) − Personalbestand 26,0 (24 + 4 × 0,5) + Abgänge 3,5 (1 + 1 + 1 + 0,5) − Zugänge 2,5 (2 + 0,5) = 5,0 Stellen. Typische Fehler: Stellenbestand 28 als Personalbestand verwendet (3,0), Altersteilzeit als ganzer Abgang (5,5), Köpfe statt Stellen gezählt (3,0) oder Mehr-/Minderbedarf vergessen (3,0).", s:"Skript Kap. 1, Musterbeispiel und Übung 1.1"},

 {t:"sc", q:"Die Rechnung für das Lager ergibt einen Nettopersonalbedarf von −2,0. Welche Aussage trifft zu?",
  o:[["Es müssen zwei Mitarbeiter eingestellt werden, um den Bedarf zu decken.",0],["Es gibt einen Personalüberhang von zwei Stellen, z. B. Abbau über Versetzung.",1],["Das Ergebnis ist falsch, weil der Nettobedarf nie negativ sein kann.",0],["Im Lager fehlen zwei Mitarbeiter, die extern beschafft werden müssen.",0]],

 {t:"mc", q:"Welche Größen sind externe Einflussgrößen auf den Personalbedarf?",

 {t:"open", q:"Erläutern Sie den Unterschied zwischen Brutto- und Nettopersonalbedarf. Erklären Sie, was ein positives und was ein negatives Ergebnis beim Nettopersonalbedarf bedeutet.",
  m:"Der Bruttopersonalbedarf gibt an, wie viele Stellen im Planungszeitraum insgesamt besetzt sein sollen (geplanter Stellenbestand). Der Nettopersonalbedarf zeigt, wie viele Mitarbeiter tatsächlich beschafft oder abgebaut werden müssen: Bruttobedarf − aktueller Bestand + feststehende Abgänge − feststehende Zugänge. Positives Ergebnis: Personalunterdeckung – es müssen Mitarbeiter eingestellt werden (z. B. extern, Übernahme von Auszubildenden, Aufstockung von Teilzeit). Negatives Ergebnis: Personalüberhang – es sind mehr Mitarbeiter da als nötig (z. B. Versetzung, natürliche Fluktuation nutzen, Überstunden abbauen).",

 {t:"sc", q:"Welche Frage ist im Vorstellungsgespräch für eine Stelle als Buchhalterin zulässig?",

 {t:"sc", q:"Welche Aussage trifft auf die Stellenbeschreibung zu?",

 {t:"sc", q:"Welche Aussage zur Beteiligung des Betriebsrats trifft zu?",

  o:[["Nie – der Nachweis verlangt immer Papier mit eigenhändiger Unterschrift.",0],["Wenn es speicher- und druckbar ist und ein Empfangsnachweis verlangt wird.",1],["Nur wenn das PDF eine qualifizierte elektronische Signatur trägt.",0],["Immer – auch eine Sprachnachricht im Messenger würde genügen.",0]],
  e:"Seit 01.01.2025 genügt für den Nachweis die Textform (§ 2 Abs. 1 Satz 2 NachwG). Ältere Lösungen nennen noch die Schriftform.", s:"Skript Kap. 3, Merke-Box Formvorschriften"},
 {t:"zu", q:"Wessen Pflicht ist das?", c:["Arbeitgeber","Arbeitnehmer"],
  r:[["Vergütungspflicht",0],["Treuepflicht (Verschwiegenheit, Rücksichtnahme)",1],["Fürsorgepflicht",0],["Arbeitspflicht nach Weisung",1],["Zeugnispflicht bei Beendigung",0],["Unterlassen von Konkurrenztätigkeit",1]],
  e:"Arbeitsvertrag: Arbeitsleistung gegen Vergütung (§§ 611a, 612 BGB); Zeugnis: § 109 GewO. Ist keine Vergütung vereinbart, gilt die übliche als vereinbart (§ 612 Abs. 2 BGB).", s:"Skript Kap. 3, Tabelle Pflichten"},
 {t:"sc", q:"In welchem Fall verstößt jemand gegen das gesetzliche Wettbewerbsverbot?",
  o:[["Eine Industriekauffrau eines Fahrradherstellers jobbt samstags in einer Bäckerei.",0],["Ein Mechaniker eines Fahrradhändlers repariert abends privat Räder von dessen Kunden.",1],["Ein Mitarbeiter bewirbt sich während seiner Kündigungsfrist bei einem Konkurrenten.",0],["Eine frühere Mitarbeiterin gründet nach ihrem Ausscheiden eine Konkurrenzfirma.",0]],
  e:"Das gesetzliche Wettbewerbsverbot gilt während des Arbeitsverhältnisses und verbietet Konkurrenztätigkeit im Geschäftszweig des Arbeitgebers. Nebentätigkeiten ohne Konkurrenz sind grundsätzlich erlaubt; nach dem Ende gilt ein Wettbewerbsverbot nur, wenn es ausdrücklich vertraglich vereinbart wurde (nachvertragliches Wettbewerbsverbot) – davon ist hier nicht die Rede.", s:"Skript Kap. 3, Übung 3.1 b"},
 {t:"mc", q:"Welche Angaben muss der Nachweis der wesentlichen Vertragsbedingungen nach dem Nachweisgesetz enthalten?",
  o:[["Familienstand des Arbeitnehmers",0],["Beginn des Arbeitsverhältnisses",1],["Religionszugehörigkeit des Arbeitnehmers",0],["Zusammensetzung und Höhe des Arbeitsentgelts",1],["Gesundheitszustand des Arbeitnehmers",0],["Name und Anschrift der Vertragsparteien",1],["Höhe des Gehalts beim früheren Arbeitgeber",0],["vereinbarte Arbeitszeit",1]],
  e:"§ 2 Abs. 1 Satz 3 NachwG – dazu u. a. Arbeitsort, Tätigkeit, Probezeit, Urlaub und das Kündigungsverfahren. Persönliche Merkmale gehören nicht dazu.", s:"Skript Kap. 3, Merke-Box Nachweisgesetz; Einzelinhalte in der Gesetzestextsammlung"},
 {t:"open", q:"Erläutern Sie, welche Formvorschriften für den Abschluss eines Arbeitsvertrags gelten.",
  m:"Der Arbeitsvertrag ist grundsätzlich formfrei, also auch mündlich wirksam. Der Arbeitgeber muss die wesentlichen Vertragsbedingungen nach dem Nachweisgesetz dokumentieren; seit 01.01.2025 genügt die Textform (z. B. PDF per E-Mail, zugänglich, speicher- und druckbar, mit Aufforderung zum Empfangsnachweis). Die Befristung bedarf der Schriftform (§ 14 Abs. 4 TzBfG), sonst gilt der Vertrag als unbefristet.",
  k:["Formfreiheit genannt","Nachweisgesetz mit Textform erläutert","Befristung: Schriftform und Folge bei Verstoß","Rechtsgrundlagen genannt"]}
]},
{ id:4, title:"Kündigung und Kündigungsschutz",
intro:[["BGB","Bürgerliches Gesetzbuch: Kündigungsfristen (§ 622), Schriftform (§ 623), fristlose Kündigung (§ 626)."],
 ["KSchG","Kündigungsschutzgesetz: Eine Kündigung durch den Arbeitgeber braucht einen Grund – gilt in Betrieben mit mehr als 10 Arbeitnehmern nach 6 Monaten Beschäftigung."],
 ["Besonderer Kündigungsschutz","Für einige Gruppen gelten eigene Gesetze: Mutterschutzgesetz (Schwangere), Bundeselterngeld- und Elternzeitgesetz (Elternzeit), Sozialgesetzbuch IX (schwerbehinderte Menschen), Berufsbildungsgesetz (Auszubildende). Betriebsratsmitglieder schützt ebenfalls das Kündigungsschutzgesetz."],
 ["Zugang","Die Kündigungsfrist beginnt mit dem Tag, an dem die Kündigung beim Empfänger ankommt – nicht mit dem Datum auf dem Schreiben."]],
rel:"Dauerbrenner: 5 von 6 Terminen (2019–2023)", skript:"Arbeitsskript Kap. 4: Fristentabelle, Merke-Boxen, Tabellen Kündigungsgründe und besonderer Kündigungsschutz, Übungen 4.1–4.3",
items:[
 {t:"sc", q:"Frau Ott ist seit 18 Monaten bei der Talwerk GmbH; die Probezeit ist lange beendet. Die ordentliche Kündigung des Arbeitgebers geht ihr am 10.12.2026 zu. Zu welchem Termin wird sie wirksam?",
  o:[["31.12.2026",0,"Die Frist von 4 Wochen wäre nicht eingehalten."],["07.01.2027",0,"Die Frist ist richtig gezählt, aber nicht auf einen zulässigen Termin (15. oder Monatsende) aufgerundet."],["15.01.2027",1],["31.01.2027",0,"Das wäre die Stufe ab 2 Jahren (1 Monat zum Monatsende) – oder der 15. wurde übersehen."]],
  e:"Unter zwei Jahren gilt auch für den Arbeitgeber die Grundfrist: 4 Wochen zum 15. oder zum Monatsende (§ 622 Abs. 1 BGB). 10.12.2026 + 28 Tage = 07.01.2027 → nächster zulässiger Termin: 15.01.2027.", s:"Skript Kap. 4, Fristentabelle und Merke-Box"},
 {t:"sc", q:"Frau Lenz ist seit 14 Jahren bei der Talwerk GmbH und will zum 31.01.2027 selbst kündigen. Wann muss ihre Kündigung dem Arbeitgeber spätestens zugehen?",
  o:[["31.08.2026",0,"Hier wurde die Staffel des Arbeitgebers (5 Monate) angewandt – sie gilt nicht für den Arbeitnehmer."],["31.12.2026",0,"Hier wurde „ein Monat“ statt 4 Wochen gerechnet."],["03.01.2027",1],["04.01.2027",0,"Einen Tag zu spät: Ab dem 04.01. reichen die 4 Wochen nicht mehr bis zum 31.01."]],
  e:"Für den Arbeitnehmer gilt immer die Grundfrist von 4 Wochen (28 Tagen) zum 15. oder zum Monatsende (§ 622 Abs. 1 BGB). Die verlängerten Fristen nach Abs. 2 gelten nur für den Arbeitgeber. 31.01.2027 − 28 Tage = 03.01.2027.", s:"Skript Kap. 4, Merke-Box und Übung 4.1 b"},
 {t:"mc", q:"Welche Aussagen sind richtig?",
  o:[["Die ordentliche Kündigung beendet das Arbeitsverhältnis nach Ablauf der Kündigungsfrist, die außerordentliche in der Regel fristlos aus wichtigem Grund.",1],["Gegen eine Kündigung kann der Arbeitnehmer innerhalb von drei Wochen nach Zugang Klage beim Arbeitsgericht erheben.",1],["Bei der Sozialauswahl zählen Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten und Schwerbehinderung.",1],["Vor einer verhaltensbedingten Kündigung ist in der Regel eine Abmahnung nötig.",1],["Eine außerordentliche Kündigung muss mit einer Frist von zwei Wochen ausgesprochen werden.",0],["Bei der Sozialauswahl wird dem Mitarbeiter mit der schlechtesten Arbeitsleistung gekündigt.",0],["Eine Kündigung des Arbeitgebers wird erst wirksam, wenn der Arbeitnehmer zustimmt.",0]],
  e:"Ordentlich: mit Kündigungsfrist (§ 622 BGB). Außerordentlich: in der Regel fristlos aus wichtigem Grund; die zwei Wochen sind die Frist, innerhalb derer sie nach Kenntnis des Grundes erklärt werden muss (§ 626 BGB). Klagefrist: § 4 KSchG. Sozialauswahl: § 1 Abs. 3 KSchG – die Leistung gehört nicht zu den Kriterien.", s:"Skript Kap. 4, Einleitung, Merke-Box Sozialauswahl und Klagefrist"},
 {t:"sc", q:"Ein Handwerksbetrieb beschäftigt regelmäßig 9 Vollzeitkräfte. Ein Mitarbeiter, seit drei Jahren dort, erhält eine ordentliche Kündigung. Gilt der allgemeine Kündigungsschutz?",
  o:[["Nein – der Betrieb beschäftigt nicht mehr als 10 Arbeitnehmer.",1],["Ja – das Arbeitsverhältnis besteht länger als sechs Monate.",0],["Ja – das Kündigungsschutzgesetz gilt in jedem Betrieb.",0],["Nein – das Kündigungsschutzgesetz gilt erst nach fünf Jahren Betriebszugehörigkeit.",0]],
  e:"Beide Voraussetzungen müssen vorliegen: mehr als 10 Arbeitnehmer (§ 23 Abs. 1 KSchG) und mehr als sechs Monate Beschäftigung (§ 1 Abs. 1 KSchG). Hier fehlt die erste.", s:"Skript Kap. 4, allgemeiner Kündigungsschutz"},
 {t:"zu", q:"Ordnen Sie den Kündigungsgrund zu (§ 1 Abs. 2 KSchG).", c:["personenbedingt","verhaltensbedingt","betriebsbedingt"],
  r:[["Ein Berufskraftfahrer verliert dauerhaft seine Fahrerlaubnis.",0],["Eine Mitarbeiterin fehlt trotz Abmahnung erneut unentschuldigt.",1],["Die Lackiererei wird stillgelegt.",2],["Ein Mitarbeiter ist dauerhaft krankheitsbedingt arbeitsunfähig.",0],["Ein Mitarbeiter verweigert wiederholt zugewiesene Arbeiten.",1],["Wegen anhaltenden Auftragsrückgangs fallen zwei Stellen weg.",2]],
  e:"Personenbedingt: vom Arbeitnehmer nicht steuerbar. Verhaltensbedingt: steuerbares Fehlverhalten, in der Regel nach Abmahnung. Betriebsbedingt: Der Arbeitsplatz fällt weg, mit Sozialauswahl.", s:"Skript Kap. 4, Tabelle Kündigungsgründe"},
 {t:"zu", q:"Welches Gesetz schützt die Person besonders vor einer Kündigung?", c:["Mutterschutzgesetz","Bundeselterngeld- und Elternzeitgesetz","Sozialgesetzbuch IX (Schwerbehinderte)","Kündigungsschutzgesetz","Berufsbildungsgesetz"],
  r:[["Mitarbeiterin im vierten Schwangerschaftsmonat",0],["Mitarbeiter in Elternzeit",1],["schwerbehinderter Mitarbeiter, seit zwei Jahren im Betrieb",2],["Mitglied des Betriebsrats",3],["Auszubildende nach Ende der Probezeit",4]],
  e:"Schwangere: Kündigungsverbot (§ 17 MuSchG). Elternzeit: Kündigungsverbot (§ 18 BEEG). In beiden Fällen kann nur eine Behörde ausnahmsweise zustimmen. Schwerbehinderte: Kündigung nur mit vorheriger Zustimmung des Integrationsamts (§ 168 SGB IX). Betriebsratsmitglieder: ordentliche Kündigung ausgeschlossen (§ 15 KSchG). Auszubildende: nach der Probezeit nur aus wichtigem Grund (§ 22 BBiG).", s:"Skript Kap. 4, Tabelle besonderer Kündigungsschutz, Übung 4.3"},
 {t:"zu", q:"Die Talwerk GmbH möchte den folgenden Personen ordentlich kündigen. Was gilt jeweils?", c:["Kündigungsverbot (Ausnahme nur durch Behörde)","nur mit Zustimmung des Integrationsamts","ordentliche Kündigung ausgeschlossen","nur aus wichtigem Grund"],
  r:[["Mitarbeiterin, die dem Arbeitgeber ihre Schwangerschaft mitgeteilt hat",0],["Mitarbeiter in Elternzeit",0],["schwerbehinderter Mitarbeiter, seit drei Jahren im Betrieb",1],["Mitglied des Betriebsrats",2],["Auszubildender im zweiten Ausbildungsjahr, dem wegen Auftragsmangels gekündigt werden soll",3]],
  e:"Für alle Fälle heißt das: Eine ordentliche Kündigung ist so nicht möglich. Beim Auszubildenden ist Auftragsmangel kein wichtiger Grund. Beim Betriebsratsmitglied ginge nur eine außerordentliche Kündigung mit Zustimmung des Betriebsrats (§ 103 BetrVG).", s:"Skript Kap. 4, Tabelle besonderer Kündigungsschutz, Übung 4.3"},
 {t:"open", q:"Erläutern Sie den Unterschied zwischen einer personen- und einer verhaltensbedingten Kündigung mit je einem Beispiel. Erklären Sie, warum vor einer verhaltensbedingten Kündigung in der Regel abgemahnt werden muss.",
  m:"Personenbedingt: Der Grund liegt in der Person, der Arbeitnehmer kann ihn nicht steuern (z. B. dauerhafte krankheitsbedingte Arbeitsunfähigkeit, Verlust der Fahrerlaubnis eines Berufskraftfahrers). Verhaltensbedingt: steuerbares Fehlverhalten (z. B. wiederholtes Zuspätkommen, Arbeitsverweigerung, unentschuldigtes Fehlen). Die Abmahnung rügt das Fehlverhalten und droht die Kündigung an; erst wenn der Arbeitnehmer danach erneut gleichartig verstößt, ist eine negative Zukunftsprognose begründet und die Kündigung sozial gerechtfertigt (§ 1 Abs. 2 KSchG). Bei personenbedingten Gründen wäre eine Abmahnung sinnlos, weil der Arbeitnehmer sein Verhalten nicht ändern kann.",
  k:["beide Arten mit dem Abgrenzungsmerkmal „steuerbar“ erklärt","je ein passendes Beispiel","Funktion der Abmahnung (Rüge und Kündigungsandrohung)","Zukunftsprognose bzw. mildere Mittel erwähnt"]}
]},
{ id:5, title:"Entlohnung",
intro:[["Zeitlohn","Bezahlt wird die Arbeitszeit: Stundenlohn × Stunden. Sinnvoll, wenn Qualität und Sorgfalt wichtiger sind als die Menge oder wenn sich die Leistung nicht messen lässt."],
 ["Akkordlohn","Bezahlt wird die Menge. Einzelakkord: Die Stückzahl einer Person zählt. Gruppenakkord: Die gemeinsame Stückzahl einer Gruppe zählt; der Gruppenverdienst wird danach aufgeteilt."],
 ["Normalleistung / Vorgabezeit","Normalleistung: Stückzahl je Stunde, die ein eingearbeiteter Mitarbeiter auf Dauer schafft. Vorgabezeit: Minuten, die je Stück gutgeschrieben werden.<br>Vorgabezeit = 60 min ÷ Normalleistung"],
 ["Akkordrichtsatz","Stundenverdienst bei genau der Normalleistung.<br>Akkordrichtsatz = Grundlohn + Akkordzuschlag (in % des Grundlohns)"],
 ["Stückgeldakkord","Je Stück gibt es einen festen Geldbetrag.<br>Stückgeldsatz = Akkordrichtsatz ÷ Normalleistung<br>Verdienst = Stückzahl × Stückgeldsatz"],
 ["Stückzeitakkord","Je Stück wird die Vorgabezeit gutgeschrieben und in Geld umgerechnet.<br>Minutenfaktor = Akkordrichtsatz ÷ 60<br>Verdienst = Stückzahl × Vorgabezeit × Minutenfaktor<br>Den Minutenfaktor nicht vorzeitig runden."],
 ["Leistungsgrad","Wie viel Prozent der Normalleistung jemand schafft. Bei 120 % liegt der Akkordverdienst 20 % über dem Akkordrichtsatz."],
 ["Prämienlohn","Fester Grundlohn plus Prämie für eine vereinbarte Mehrleistung. In der Prüfung meist: Ein vereinbarter Anteil der ersparten Zeit wird mit dem Grundlohn vergütet."],
 ["Achtung „Mindestlohn“","Fragt eine Aufgabe nach dem „Mindestlohn“ im Akkord, ist der Grundlohn ohne Akkordzuschlag gemeint – nicht der gesetzliche Mindestlohn nach dem Mindestlohngesetz."]],
rel:"Dauerbrenner: 6 von 6 Terminen (2019–2023)", skript:"Arbeitsskript Kap. 5: Merke-Box, drei Musterbeispiele (Akkord, Gruppenakkord, Prämienlohn), Übungen 5.1–5.5",
items:[
 {t:"zu", q:"Welche Lohnform passt am besten?", c:["Zeitlohn","Akkordlohn","Prämienlohn"],
  r:[["Eine Laborantin prüft Materialproben; Genauigkeit ist wichtiger als Tempo.",0],["Ein Mitarbeiter bestückt Platinen in immer gleichen, gut messbaren Arbeitsgängen und bestimmt sein Tempo selbst.",1],["Ein Lagerarbeiter erhält zum Stundenlohn einen Zuschlag, wenn er beim Kommissionieren weniger Fehler macht als vereinbart.",2],["Eine Sachbearbeiterin im Einkauf hat jeden Tag wechselnde Aufgaben.",0],["An einer Montagelinie wird die Stückzahl vergütet, die eine Gruppe gemeinsam fertigt.",1],["Ein Maschinenführer erhält zum Grundlohn die Hälfte der eingesparten Vorgabezeit vergütet.",2]],
  e:"Zeitlohn, wenn Qualität vor Menge geht oder die Leistung nicht messbar ist. Akkordlohn, wenn die Menge messbar und beeinflussbar ist – einzeln oder als Gruppe. Prämienlohn: Grundlohn plus Prämie für eine vereinbarte Mehrleistung, z. B. Qualität oder ersparte Zeit.", s:"Skript Kap. 5, Einleitung und Grafik Lohnformen"},
 {t:"mc", q:"Die Talwerk GmbH prüft, ob sie in der Montage Akkordlohn einführen kann. Welche Aussagen beschreiben Voraussetzungen für den Akkordlohn?",
  o:[["Der Arbeitsablauf ist gleichartig, wiederholt sich und lässt sich im Voraus messen.",1],["Die Mitarbeiter beherrschen den Arbeitsablauf vollständig.",1],["Die Mitarbeiter können die Menge durch ihr Arbeitstempo beeinflussen.",1],["Die Leistung lässt sich messen und einer Person oder Gruppe zurechnen.",1],["Die Qualität der Arbeit ist wichtiger als die Menge.",0,"Dann ist Zeitlohn geeigneter – Akkord verleitet zum Tempo auf Kosten der Qualität."],["Das Arbeitstempo wird vollständig von einem Fließband vorgegeben.",0,"Dann kann der Mitarbeiter die Menge nicht beeinflussen."],["Die Mitarbeiter sind neu und noch in der Einarbeitung.",0,"Es fehlt die Akkordreife."]],
  e:"Akkordfähigkeit (gleichartig, wiederholbar, messbar), Akkordreife (Ablauf voll beherrscht), beeinflussbare Menge, messbare und zurechenbare Leistung.", s:"Skript Kap. 5, Merke-Box und Übung 5.1 b"},
 {t:"za", q:"In der Montage der Talwerk GmbH beträgt der Grundlohn 17,50 € je Stunde, der Akkordzuschlag 20 %. Die Normalleistung liegt bei 15 Stück je Stunde. Ein Mitarbeiter fertigt im Juni 2.550 Stück. Berechnen Sie seinen Bruttolohn im Stückgeldakkord.", unit:"€", a:3570,
  e:"Akkordrichtsatz: 17,50 € × 1,20 = 21,00 €. Stückgeldsatz: 21,00 € ÷ 15 = 1,40 €. Bruttolohn: 2.550 × 1,40 € = 3.570,00 €. Typischer Fehler: Akkordzuschlag vergessen (17,50 € ÷ 15 × 2.550 = 2.975,00 €).", s:"Skript Kap. 5, Musterbeispiel Akkord und Übung 5.1"},
 {t:"za", q:"In der Endkontrolle gilt ein Grundlohn von 17,00 € je Stunde und ein Akkordzuschlag von 25 %. Die Normalleistung beträgt 12 Stück je Stunde. Eine Mitarbeiterin prüft an einem 8-Stunden-Tag 108 Stück. Berechnen Sie ihren Tagesverdienst im Stückzeitakkord.", unit:"€", a:191.25,
  e:"Akkordrichtsatz: 17,00 € × 1,25 = 21,25 €. Minutenfaktor: 21,25 € ÷ 60 = 0,354166… €. Vorgabezeit: 60 ÷ 12 = 5 min. Verdienst: 108 × 5 min × 0,354166… € = 540 min × 0,354166… € = 191,25 €. Probe: 540 Vorgabeminuten sind 9 Stunden; 9 × 21,25 € = 191,25 €. Typischer Fehler: Minutenfaktor auf 0,35 € gerundet (189,00 €) oder auf 0,36 € (194,40 €). Leistungsgrad: 540 ÷ 480 = 112,5 %.", s:"Skript Kap. 5, Musterbeispiel (Alternative Stückzeitakkord) und Übung 5.2"},
 {t:"sc", q:"Der Akkordrichtsatz in der Lackiererei beträgt 22,50 € je Stunde, der Akkordzuschlag 25 %. Wie hoch ist der Mindestlohn je Stunde?",
  o:[["18,00 €",1],["16,88 €",0,"Hier wurden 25 % vom Akkordrichtsatz abgezogen. Der Zuschlag bezieht sich aber auf den Grundlohn: also durch 1,25 teilen."],["13,90 €",0,"Das ist der gesetzliche Mindestlohn 2026. Gemeint ist hier der Grundlohn ohne Akkordzuschlag."],["28,13 €",0,"Hier wurde der Zuschlag noch einmal aufgeschlagen statt herausgerechnet."]],
  e:"Mindestlohn im Akkord = Grundlohn = Akkordrichtsatz ÷ (1 + Akkordzuschlag) = 22,50 € ÷ 1,25 = 18,00 €. Probe: 18,00 € × 1,25 = 22,50 €.", s:"Skript Kap. 5, Hinweis „Achtung Begriffe“ und Übung 5.2 b"},
 {t:"za", q:"Im Zuschnitt gilt Prämienlohn: Grundlohn 17,00 € je Stunde, Vorgabezeit 16 Minuten je Stück, Prämie 50 % des ersparten Zeitlohns. Eine Mitarbeiterin fertigt an einem 8-Stunden-Tag 36 Stück. Berechnen Sie ihren Bruttostundenlohn.", unit:"€", a:18.7,
  e:"Vorgabezeit gesamt: 36 × 16 min = 576 min = 9,6 Std. Ersparte Zeit: 9,6 − 8,0 = 1,6 Std. Prämie: 1,6 × 17,00 € × 50 % = 13,60 €. Tageslohn: 8 × 17,00 € + 13,60 € = 149,60 €. Stundenlohn: 149,60 € ÷ 8 = 18,70 €. Typischer Fehler: die ganze ersparte Zeit vergütet statt 50 % (20,40 €).", s:"Skript Kap. 5, Musterbeispiel Prämienlohn und Übung 5.4"},
 {t:"za", q:"In der Vormontage arbeiten drei Beschäftigte im Gruppenakkord: Herr Arnold (Grundlohn 21,00 €, 160 Std.), Frau Brehm (18,00 €, 120 Std. – sie arbeitet in Teilzeit) und Herr Celik (16,00 €, 160 Std.). Die Gruppe fertigt 4.040 Stück bei einem Stückgeldsatz von 2,30 €. Der Gruppenverdienst wird nach den Grundlohnanteilen verteilt. Berechnen Sie den Anteil von Frau Brehm.", unit:"€", a:2484,
  e:"Gruppenverdienst: 4.040 × 2,30 € = 9.292,00 €. Grundlohnsummen: 3.360,00 € + 2.160,00 € + 2.560,00 € = 8.080,00 €. Verteilungsfaktor: 9.292,00 € ÷ 8.080,00 € = 1,15 (die Gruppe lag 15 % über der Normalleistung). Anteil Brehm: 2.160,00 € × 1,15 = 2.484,00 €. Probe: 3.864,00 + 2.484,00 + 2.944,00 = 9.292,00 €. Typischer Fehler: gleich verteilt (3.097,33 €) oder nur nach Stundenlöhnen ohne Stunden (3.041,02 €).", s:"Skript Kap. 5, Musterbeispiel Gruppenakkord und Übung 5.3"},
 {t:"mc", q:"Welche Aussagen zu Einzel- und Gruppenakkord sind richtig?",
  o:[["Gruppenakkord bietet sich an, wenn mehrere Beschäftigte gemeinsam an einem Erzeugnis arbeiten und die Menge des Einzelnen nicht feststellbar ist.",1],["Wer bei gleichem Grundlohn mehr Stunden gearbeitet hat, erhält beim Gruppenakkord einen größeren Anteil.",1],["Ein Verteilungsfaktor von 1,1 bedeutet, dass die Gruppe 10 % über der Normalleistung lag.",1],["Beim Gruppenakkord kann ein schwächeres Mitglied den Verdienst der ganzen Gruppe senken.",1],["Beim Gruppenakkord erhält jedes Mitglied immer denselben Betrag.",0],["Beim Einzelakkord hängt der Verdienst nicht von der eigenen Stückzahl ab.",0],["Wer im Akkord genau die Normalleistung erreicht, verdient nur den Grundlohn.",0]],
  e:"Gruppenakkord, wenn die Menge nicht einzeln zurechenbar ist; verteilt wird meist nach Grundlohnsummen (Stundenlohn × Stunden). Der Verteilungsfaktor zeigt den Leistungsgrad der Gruppe. Bei genau der Normalleistung verdient man den Akkordrichtsatz, also Grundlohn plus Akkordzuschlag.", s:"Skript Kap. 5, Merke-Box und Übung 5.3 c"},
 {t:"open", q:"Die Talwerk GmbH überlegt, in der Montage vom Zeitlohn auf Akkordlohn umzustellen. Beurteilen Sie den Akkordlohn: Erläutern Sie je einen Vorteil und einen Nachteil aus Sicht der Arbeitnehmer und aus Sicht des Arbeitgebers.",
  m:"Arbeitnehmer – Vorteil: Wer mehr leistet, verdient mehr; der Verdienst lässt sich durch eigene Leistung steigern. Nachteil: Leistungsdruck und Gesundheitsgefahr durch dauerhaft hohes Tempo; der Verdienst schwankt, z. B. bei Krankheit, Materialmangel oder Maschinenstörung. Arbeitgeber – Vorteil: höhere Produktivität; die Lohnkosten je Stück stehen fest und lassen sich gut kalkulieren. Nachteil: Die Qualität kann leiden, Maschinen und Material werden stärker beansprucht; dazu kommen Aufwand für Zeitstudien und Kontrolle sowie Streit um die Vorgabezeiten.",
  k:["Vorteil aus Sicht der Arbeitnehmer erläutert","Nachteil aus Sicht der Arbeitnehmer erläutert","Vorteil aus Sicht des Arbeitgebers erläutert","Nachteil aus Sicht des Arbeitgebers erläutert"]}
]}
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(n){return n.toLocaleString("de-DE",{maximumFractionDigits:2});}
function level(p){return p>=0.8?["g","fit"]:p>=0.5?["y","Lücken schließen"]:["rd","Kapitel wiederholen"];}
function autoCount(ch){return ch.items.filter(x=>x.t!=="open").length;}

function home(){
  cur=null;
  let h=`<div class="kicker">Betriebswirtschaft · Personal</div><h1>Selbsttest Personal</h1>
  <p class="meta">Kapitel 1–5 des Arbeitsskripts · ca. 35 Minuten</p>
  <div class="box">Arbeiten Sie die Kapitel nacheinander oder einzeln durch. Nach jeder Aufgabe sehen Sie sofort die Lösung mit Erklärung. Am Ende jedes Kapitels zeigt eine Ampel, wie fit Sie sind.<br>Die Gesetzestextsammlung dürfen Sie benutzen. Es werden keine Daten gespeichert oder übertragen.</div>`;
  CHAPTERS.forEach(ch=>{
    const r=state.res[ch.id]; let badge="";
    if(r){const [c,l]=level(r.pts/r.max); badge=`<span class="r ${c}">${l}</span>`;}
    h+=`<button class="chap" data-c="${ch.id}">${badge}<span class="n">Kapitel ${ch.id}</span> · ${esc(ch.title)}<div class="rel">${esc(ch.rel)}</div></button>`;
  });
  if(Object.keys(state.res).length) h+=`<div class="row"><button class="btn sec" id="sum">Gesamtauswertung</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".chap").forEach(b=>b.onclick=()=>start(+b.dataset.c));
  const s=document.getElementById("sum"); if(s) s.onclick=summary;
  window.scrollTo(0,0);
}

function start(id){
  const ch=CHAPTERS.find(c=>c.id===id);
  cur={ch, i:0, pts:0, open:[0,0], order:ch.items.map(it=>it.o?shuffle(it.o.map((x,k)=>k)):null), rows:ch.items.map(it=>it.r?shuffle(it.r.map((x,k)=>k)):null)};
  if(ch.intro) intro(); else show();
}

function intro(){
  const ch=cur.ch;
  let h=`<div class="kicker">Kapitel ${ch.id} · ${esc(ch.title)}</div><h2>Kurz erklärt</h2>
  <p class="meta">Lesen Sie die Begriffe kurz durch – Sie brauchen sie in den Aufgaben.</p><table><tbody>`;
  ch.intro.forEach(([t,d])=>{h+=`<tr><td style="width:34%"><b>${esc(t)}</b></td><td>${d}</td></tr>`;});
  h+=`</tbody></table><div class="row"><button class="btn" id="go">Los geht’s</button><button class="btn sec" id="back">Zur Übersicht</button></div>`;
  app.innerHTML=h; document.getElementById("go").onclick=show; document.getElementById("back").onclick=home; window.scrollTo(0,0);
}

function show(){
  const {ch,i}=cur, it=ch.items[i], n=ch.items.length;
  let h=`<div class="kicker">Kapitel ${ch.id} · ${esc(ch.title)}</div>
  <div class="meta">Aufgabe ${i+1} von ${n}${it.t==="open"?" · offene Aufgabe":""}</div>
  <div class="prog"><i style="width:${(i/n)*100}%"></i></div>
  <div class="q">${esc(it.q)}</div>`;
  if(it.t==="sc"||it.t==="mc"){
    h+=`<div class="hint">${it.t==="sc"?"Eine Antwort ist richtig.":"Mehrere Antworten sind richtig."}</div>`;
    cur.order[i].forEach(k=>{
      h+=`<label class="opt" data-k="${k}"><input type="${it.t==="sc"?"radio":"checkbox"}" name="o" value="${k}"><span>${esc(it.o[k][0])}<span class="why"></span></span></label>`;
    });
  } else if(it.t==="zu"){
    cur.rows[i].forEach(k=>{ const row=it.r[k];
      h+=`<div class="zu" data-k="${k}"><label for="z${k}">${esc(row[0])}</label><select id="z${k}"><option value="">– bitte wählen –</option>${it.c.map((c,j)=>`<option value="${j}">${esc(c)}</option>`).join("")}</select><div class="sol"></div></div>`;
    });
  } else if(it.t==="za"){
    h+=`<div class="za"><label class="sr" for="za">Ergebnis</label><input id="za" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 12,5"><span>${esc(it.unit)}</span></div>`;
  } else if(it.t==="open"){
    h+=`<div class="hint">Formulieren Sie Ihre Antwort wie in der Prüfung – auf Papier oder hier im Feld. Das Feld wird nicht gespeichert.</div><textarea aria-label="Ihre Antwort"></textarea>`;
  }
  h+=`<div id="fb"></div><div class="row" id="act">
    <button class="btn" id="chk">${it.t==="open"?"Musterlösung anzeigen":"Prüfen"}</button>
    <button class="btn sec" id="back">Zur Übersicht</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".opt input").forEach(inp=>inp.onchange=()=>app.querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked)));
  document.getElementById("chk").onclick=check;
  document.getElementById("back").onclick=home;
  const za=document.getElementById("za"); if(za) za.addEventListener("keydown",e=>{if(e.key==="Enter")check();});
  window.scrollTo(0,0);
}

const LAWS=[["SGB IX","Sozialgesetzbuch IX"],["BGB","Bürgerliches Gesetzbuch"],["KSchG","Kündigungsschutzgesetz"],["AGG","Allgemeines Gleichbehandlungsgesetz"],["BetrVG","Betriebsverfassungsgesetz"],["NachwG","Nachweisgesetz"],["TzBfG","Teilzeit- und Befristungsgesetz"],["GewO","Gewerbeordnung"],["MuSchG","Mutterschutzgesetz"],["BEEG","Bundeselterngeld- und Elternzeitgesetz"],["BBiG","Berufsbildungsgesetz"]];
function laws(t){ LAWS.forEach(([a,n])=>{ const re=new RegExp("(^|[^\\wÄÖÜäöü(-])("+a.replace(" ","\\s")+")(?![\\wÄÖÜäöü-])(?!\\s\\()"); const m=re.exec(t); if(!m) return; const end=m.index+m[0].length; const ins = t[end]===")" ? ", "+n : " ("+n+")"; t=t.slice(0,end)+ins+t.slice(end); }); return t; }

function verdict(p){return p>=0.999?["ok","Richtig."]:p>0?["mid","Teilweise richtig."]:["bad","Leider nicht richtig."];}

function check(){
  const {ch,i}=cur, it=ch.items[i]; let p=0, extra="";
  if(it.t==="sc"||it.t==="mc"){
    const chosen=[...app.querySelectorAll(".opt input")].filter(x=>x.checked).map(x=>+x.value);
    if(!chosen.length){alert0("Bitte wählen Sie mindestens eine Antwort.");return;}
    const nTrue=it.o.filter(x=>x[1]).length;
    let good=0,bad=0;
    app.querySelectorAll(".opt").forEach(l=>{
      const k=+l.dataset.k, isT=it.o[k][1], sel=chosen.includes(k);
      l.querySelector("input").disabled=true; l.classList.remove("sel");
      if(sel&&isT){l.classList.add("right");good++;}
      else if(sel&&!isT){l.classList.add("wrong");bad++; if(it.o[k][2]) l.querySelector(".why").textContent=it.o[k][2];}
      else if(!sel&&isT){l.classList.add("missed");}
    });
    p = it.t==="sc" ? (good?1:0) : Math.max(0,(good-bad)/nTrue);
    if(it.t==="mc") extra=`Richtig waren ${nTrue} Aussagen. Sie hatten ${good} richtige und ${bad} falsche Kreuze. Gestrichelt umrandet: richtig, aber nicht angekreuzt.`;
  } else if(it.t==="zu"){
    const sels=[...app.querySelectorAll(".zu select")];
    if(sels.some(s=>s.value==="")){alert0("Bitte ordnen Sie jede Zeile zu.");return;}
    let good=0;
    sels.forEach(s=>{const k=+s.id.slice(1); const ok=+s.value===it.r[k][1]; const box=s.parentNode; s.disabled=true;
      box.classList.add(ok?"right":"wrong"); if(ok)good++; else box.querySelector(".sol").textContent="Richtig: "+it.c[it.r[k][1]];});
    p=good/it.r.length; extra=`${good} von ${it.r.length} Zuordnungen richtig.`;
  } else if(it.t==="za"){
    const inp=document.getElementById("za"); let raw=inp.value.trim().replace(/\s/g,"");
    raw = raw.includes(",") ? raw.replace(/\./g,"").replace(",",".") : raw;
    const v=parseFloat(raw);
    if(inp.value.trim()===""||isNaN(v)){alert0("Bitte geben Sie eine Zahl ein.");return;}
    inp.disabled=true; p=Math.abs(v-it.a)<0.001?1:0;
    extra=`Ihre Eingabe: ${fmt(v)} · Lösung: ${fmt(it.a)} ${esc(it.unit)}`;
  } else if(it.t==="open"){
    app.querySelector("textarea").readOnly=true;
    document.getElementById("fb").innerHTML=`<div class="fb"><div class="v">Musterlösung</div><p>${esc(laws(it.m))}</p></div>
      <div class="check"><div class="hint">Haken Sie ab, was Ihre Antwort enthält:</div>${it.k.map((k,j)=>`<label><input type="checkbox" data-j="${j}"><span>${esc(k)}</span></label>`).join("")}</div>`;
    nextBtn(()=>{const c=app.querySelectorAll(".check input:checked").length; cur.open=[cur.open[0]+c,cur.open[1]+it.k.length];});
    return;
  }
  cur.pts+=p;
  const [cls,txt]=verdict(p);
  document.getElementById("fb").innerHTML=`<div class="fb"><div class="v ${cls}">${txt}</div>${extra?`<p>${extra}</p>`:""}<p>${esc(laws(it.e))}</p><div class="src">Nachlesen: ${esc(it.s)}</div></div>`;
  nextBtn();
}

function alert0(msg){document.getElementById("fb").innerHTML=`<div class="fb"><div class="v bad">${esc(msg)}</div></div>`;}

function nextBtn(before){
  const last=cur.i===cur.ch.items.length-1;
  document.getElementById("act").innerHTML=`<button class="btn" id="nx">${last?"Auswertung":"Weiter"}</button><button class="btn sec" id="back">Zur Übersicht</button>`;
  document.getElementById("back").onclick=home;
  document.getElementById("nx").onclick=()=>{ if(before) before(); if(last) result(); else {cur.i++; show();} };
  document.getElementById("nx").focus({preventScroll:true});
}

function result(){
  const {ch}=cur, max=autoCount(ch);
  state.res[ch.id]={pts:cur.pts,max,open:cur.open};
  const q=cur.pts/max, [c,l]=level(q);
  const next=CHAPTERS.find(x=>x.id>ch.id);
  let h=`<div class="kicker">Kapitel ${ch.id} · ${esc(ch.title)}</div><h2>Auswertung</h2>
  <p><span class="badge ${c}">${l}</span></p>
  <p>${fmt(cur.pts)} von ${max} Punkten (${Math.round(q*100)} %) in den automatisch ausgewerteten Aufgaben.</p>
  ${cur.open[1]?`<p>Offene Aufgabe – Ihre Selbsteinschätzung: ${cur.open[0]} von ${cur.open[1]} Punkten der Checkliste erfüllt.</p>`:""}
  <div class="box">${q>=0.8?"Gut vorbereitet. Wiederholen Sie trotzdem die Aufgaben, bei denen Sie unsicher waren.":q>=0.5?"Die Grundlagen sitzen, es gibt aber Lücken. Arbeiten Sie die falsch gelösten Aufgaben im Skript nach.":"Hier fehlt noch einiges. Wiederholen Sie das Kapitel im Skript und machen Sie den Test danach noch einmal."}<br><b>Nachlesen:</b> ${esc(ch.skript)}</div>
  <p class="rel">Prüfungsrelevanz: ${esc(ch.rel)}</p>
  <div class="row">${next?`<button class="btn" id="nx">Weiter mit Kapitel ${next.id}</button>`:`<button class="btn" id="sum">Gesamtauswertung</button>`}
  <button class="btn sec" id="again">Kapitel wiederholen</button><button class="btn sec" id="home">Zur Übersicht</button></div>`;
  app.innerHTML=h;
  if(next) document.getElementById("nx").onclick=()=>start(next.id); else document.getElementById("sum").onclick=summary;
  document.getElementById("again").onclick=()=>start(ch.id);
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

function summary(){
  let h=`<div class="kicker">Selbsttest Personal</div><h2>Gesamtauswertung</h2>
  <table><thead><tr><th>Kapitel</th><th>Ergebnis</th><th>Stand</th></tr></thead><tbody>`;
  CHAPTERS.forEach(ch=>{const r=state.res[ch.id];
    if(r){const [c,l]=level(r.pts/r.max); h+=`<tr><td>${ch.id} · ${esc(ch.title)}</td><td>${Math.round(r.pts/r.max*100)} %</td><td><span class="badge ${c}">${l}</span></td></tr>`;}
    else h+=`<tr><td>${ch.id} · ${esc(ch.title)}</td><td>–</td><td class="meta">noch nicht bearbeitet</td></tr>`;});
  h+=`</tbody></table><div class="box">Tipp: Notieren Sie sich die Kapitel mit Gelb oder Rot und arbeiten Sie sie mit dem Skript nach. Das Ergebnis wird nicht gespeichert – machen Sie bei Bedarf einen Screenshot.</div>
  <div class="row"><button class="btn sec" id="home">Zur Übersicht</button></div>`;
  app.innerHTML=h; document.getElementById("home").onclick=home; window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
